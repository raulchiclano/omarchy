add_newline = true
command_timeout = 200
format = "[󰣇](#B4A1F5) $directory$git_branch$git_status$character"

[character]
error_symbol = "[✗](bold #F7768E)"
success_symbol = "[❯](bold #B4A1F5)"

[directory]
style = "bold #B4A1F5"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold #B4A1F5"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "#A69BB8"

[git_status]
format     = '[$all_status]($style)'
style      = "#E0AF68"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
